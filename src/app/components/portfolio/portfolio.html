<section class="portfolio-container max-width">
  <div class="portfolio-text-container">
    <div class="portfolio-main-text">
      <span class="portfolio">
        {{ 'PORTFOLIO.LABEL' | translate }}
      </span>

      <h1>
        {{ 'PORTFOLIO.TITLE' | translate }}
      </h1>

      <p>
        {{ 'PORTFOLIO.DESCRIPTION' | translate }}
      </p>
    </div>
  </div>

  <div class="main-projects">
    <div class="project" (click)="onOpenJoinDialog()">
      <div class="project-text">
        <div class="project-text-inner">
          <h2>
            Join
            <img class="arrow" src="/assets/Portoflio/arrow_outward.png" alt="arrow" />
          </h2>

          <p>
            Angular
            <span class="pipe">|</span>
            TypeScript
            <span class="pipe">|</span>
            HTML
            <span class="pipe">|</span>
            CSS
            <span class="pipe">|</span>
            Firebase
          </p>
        </div>
      </div>

      <img class="project-image" src="/assets/Portoflio/join.png" alt="Join" />
    </div>

    <div class="project" (click)="onOpenElPolloLocoDialog()">
      <div class="project-text">
        <div class="project-text-inner">
          <h2>
            El Pollo Loco

            <img class="arrow" src="/assets/Portoflio/arrow_outward.png" alt="arrow" />
          </h2>

          <p>
            HTML
            <span class="pipe">|</span>
            CSS
            <span class="pipe">|</span>
            JavaScript
          </p>
        </div>
      </div>

      <img class="project-image" src="/assets/Portoflio/el-pollo-loco.png" alt="El Pollo Loco" />
    </div>

    <div class="project" (click)="onOpenCoderrDialog()">
      <div class="project-text">
        <div class="project-text-inner">
          <h2>
            Coderr

            <img class="arrow" src="/assets/Portoflio/arrow_outward.png" alt="arrow" />
          </h2>

          <p>
            Python
            <span class="pipe">|</span>
            Django
            <span class="pipe">|</span>
            Linux
          </p>
        </div>
      </div>

      <img class="project-image" src="/assets/Portoflio/Coderr.png" alt="Coderr" />
    </div>
  </div>
</section>
