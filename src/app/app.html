@if (router.url !== '/legal-notice') {
  <app-header id="home"></app-header>

  <app-about-me id="about"></app-about-me>

  <app-skills id="skills"></app-skills>

  <app-portfolio
    id="projects"
    (openJoinDialog)="openJoinDialog()"
    (openElPolloLocoDialog)="openElPolloLocoDialog()"
    (openCoderrDialog)="openCoderrDialog()">
  </app-portfolio>

  <app-references></app-references>

  <app-contact-me id="contact"></app-contact-me>

  <app-footer></app-footer>
} @else {
  <router-outlet></router-outlet>
}
